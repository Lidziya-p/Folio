<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<style>
html,body{margin:0;padding:0;background:rgb(11,11,10)}
a{color:inherit;text-decoration:none}
a:hover{opacity:.7}
</style>
</helmet>
<div style="{{ pageStyle }}">

  <div style="{{ bandStyle }}">
    <div style="{{ headerRowStyle }}">
      <a href="./Homepage.dc.html" style="{{ logoStyle }}">Lidziya Piatrova</a>
      <button type="button" aria-label="Menu" onClick="{{ toggleMenu }}" style="{{ burgerStyle }}"><span style="{{ burgerLine1 }}"></span><span style="{{ burgerLine2 }}"></span><span style="{{ burgerLine3 }}"></span></button>
      <div style="{{ navRowStyle }}">
        <a href="./Homepage.dc.html" style="{{ navStyle }}">HOME</a>
        <a href="./Projects.dc.html" style="{{ navActiveStyle }}">PROJECTS</a>
        <a href="./CV.dc.html" style="{{ navStyle }}">CV</a>
        <a href="./Contact.dc.html" style="{{ navStyle }}">CONTACT</a>
      </div>
    </div>
    <div style="{{ bandCopyStyle }}">
      <h1 style="{{ titleStyle }}">All projects</h1>
    </div>
  </div>

  <div style="{{ heroWrapStyle }}">
    <a href="./Iglucraft.dc.html" data-reveal="card" style="{{ heroCardStyle }}">
      <div style="{{ heroMediaStyle }}">
        <img src="./assets/iglucraft-cover.png" alt="Iglucraft website - Kuld Muna ’23" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block">
      </div>
      <div style="{{ heroCopyStyle }}">
        <span style="{{ heroNameStyle }}">Iglucraft</span>
        <span style="{{ heroMetaStyle }}">Website · Kuld Muna ’23</span>
      </div>
    </a>
  </div>

  <div style="{{ gridStyleTop }}">
    <sc-for list="{{ items }}" as="item" hint-placeholder-count="7">
      <a href="{{ item.href }}" data-reveal="card" style="{{ item.wrapStyle }}">
        <div style="{{ item.mediaStyle }}">
          <image-slot id="{{ item.slotId }}" shape="rect" fit="cover" src="{{ item.src }}" placeholder="{{ item.placeholder }}"></image-slot>
        </div>
        <div style="display:flex;flex-direction:column;gap:10px;align-items:flex-start">
          <span style="{{ item.nameStyle }}">{{ item.name }}</span>
          <span style="{{ item.metaStyle }}">{{ item.meta }}</span>
        </div>
      </a>
    </sc-for>
  </div>

  <div style="{{ heroWrapStyle2 }}">
    <a href="./BodyTwins.dc.html" data-reveal="card" style="{{ heroCardStyle }}">
      <div style="{{ heroMediaStyle }}">
        <img src="./assets/bodytwins-cover.png" alt="BodyTwins AR app on two phones" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block">
      </div>
      <div style="{{ heroCopyStyle }}">
        <span style="{{ heroNameStyle }}">BodyTwins</span>
        <span style="{{ heroMetaStyle }}">MA thesis · Estonian Academy of Arts</span>
      </div>
    </a>
  </div>

  <div style="{{ subheadStyle }}">
    <h3 data-reveal="head" style="{{ subheadTitleStyle }}">Small but favourite</h3>
  </div>

  <div style="{{ gridStyle }}">
    <sc-for list="{{ smallItems }}" as="item" hint-placeholder-count="3">
      <a href="{{ item.href }}" data-reveal="card" style="{{ item.wrapStyle }}">
        <div style="{{ item.mediaStyle }}">
          <image-slot id="{{ item.slotId }}" shape="rect" fit="cover" src="{{ item.src }}" placeholder="{{ item.placeholder }}"></image-slot>
        </div>
        <div style="display:flex;flex-direction:column;gap:10px;align-items:flex-start">
          <span style="{{ item.nameStyle }}">{{ item.name }}</span>
          <span style="{{ item.metaStyle }}">{{ item.meta }}</span>
        </div>
      </a>
    </sc-for>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;mood&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Cream editorial&quot;,&quot;Ink gallery&quot;,&quot;Acid studio&quot;],&quot;default&quot;:&quot;Ink gallery&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Feel&quot;},&quot;columns&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;min&quot;:2,&quot;max&quot;:4,&quot;step&quot;:1,&quot;default&quot;:3,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Grid&quot;},&quot;tileShape&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Landscape&quot;,&quot;Portrait&quot;],&quot;default&quot;:&quot;Landscape&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Grid&quot;},&quot;reveal&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Fade up&quot;,&quot;Scale in&quot;,&quot;Slide in&quot;,&quot;Off&quot;],&quot;default&quot;:&quot;Fade up&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Motion&quot;}}">
const MOODS = {
  "Cream editorial": { page: "rgb(254,249,241)", ink: "rgb(27,27,27)", band: "rgb(27,28,23)", card: "rgb(54,54,54)", bandInk: "rgb(254,249,241)" },
  "Ink gallery": { page: "rgb(11,11,10)", ink: "rgb(244,240,232)", band: "rgb(11,11,10)", card: "rgb(43,43,40)", bandInk: "rgb(244,240,232)" },
  "Acid studio": { page: "rgb(234,225,10)", ink: "rgb(20,20,18)", band: "rgb(20,20,18)", card: "rgb(20,20,18)", bandInk: "rgb(234,225,10)" },
};

const ITEMS = [
  { slotId: "g4", name: "Spotify Memories", meta: "App concept · Spotify × EKA", placeholder: "Spotify", href: "./Spotify.dc.html", src: "./assets/spotify-cover.png" },
  { slotId: "g5", name: "Apollo TV", meta: "Streaming platform", placeholder: "Apollo TV", href: "./Apollo TV.dc.html", src: "./assets/apollo-cover.png" },
  { slotId: "g7", name: "Warmeston", meta: "Platform · Wood pellet manufacturer", placeholder: "Warmeston", href: "./Warmeston.dc.html", src: "./assets/warmeston-cover@2x.png" },
  { slotId: "g6", name: "PXL", meta: "Platform · Film production", placeholder: "PXL", href: "./PXL.dc.html", src: "./assets/pxl-cover.png" },
  { slotId: "g8", name: "Steed", meta: "App · Equine health", placeholder: "Steed", href: "./Steed.dc.html", src: "./assets/steed-cover.png" },
  { slotId: "g2", name: "Jõekääru Linnak", meta: "Website · Kuld Muna ’25 shortlist", placeholder: "Jõekääru Linnak", href: "./Joekaaru Linnak.dc.html", src: "./assets/joekaaru-cover-v2.png" },
];

const UNI = [
  { slotId: "u1", name: "Project name", meta: "University project · Course", placeholder: "Project image" },
  { slotId: "u2", name: "Project name", meta: "University project · Course", placeholder: "Project image" },
];

const SMALL = [
  { slotId: "s4-eestonia", name: "E-Estonia Briefing Centre", meta: "Website", placeholder: "E-Estonia", href: "./E-Estonia.dc.html", src: "./assets/eestonia-cover.png" },
  { slotId: "s5-helge", name: "Helge", meta: "App · Dashboard", placeholder: "Helge", href: "./Helge.dc.html", src: "./assets/helge-cover.png" },
  { slotId: "s6-swedbank", name: "Swedbank x Ma armastan aidata", meta: "Donation platform", placeholder: "Swedbank", href: "./Swedbank.dc.html", src: "./assets/swedbank-cover.png" },
  { slotId: "s11-ewac", name: "EWAC", meta: "Website", placeholder: "EWAC", href: "./EWAC.dc.html", src: "./assets/ewac-cover-v2.png" },
  { slotId: "s10-solarstone", name: "Solarstone", meta: "Roof configurator", placeholder: "Solarstone", href: "./Solarstone.dc.html", src: "./assets/solarstone-cover.png" },
  { slotId: "s9-paula", name: "Paola", meta: "Website", placeholder: "Paola", href: "./Paola.dc.html", src: "./assets/paula-cover.png" },
  { slotId: "s1-pataka", name: "Pataka", meta: "Restaurant", placeholder: "Pataka", href: "./Pataka.dc.html", src: "./assets/pataka-cover-v2.png" },
  { slotId: "s2-iglupark", name: "Iglupark", meta: "Aparthotel", placeholder: "Iglupark", href: "./Iglupark.dc.html", src: "./assets/iglupark-cover.png" },
  { slotId: "s3-composite", name: "Composite Plus", meta: "Tooling supplier", placeholder: "Composite Plus", href: "./Composite Plus.dc.html", src: "./assets/composite-cover.png" },
];

const AI = [
  { slotId: "a1", name: "Project name", meta: "AI experiment · Prototype", placeholder: "AI experiment" },
  { slotId: "a2", name: "Project name", meta: "AI experiment · Prototype", placeholder: "AI experiment" },
  { slotId: "a3", name: "Project name", meta: "AI experiment · Prototype", placeholder: "AI experiment" },
];

const CATS = { g1: "Website", g2: "Website", g3: "App", g4: "App", g5: "Platform", g6: "Platform", g7: "Platform" };
const TABS = ["All", "App", "Platform", "Website"];

class Component extends DCLogic {
  state = { filter: "All" };
  componentDidMount() {
    this.mountReveal();
  }
  componentDidUpdate() {
    const mode = this.props.reveal ?? "Fade up";
    if (this._reveal && mode !== this._mode) {
      this._mode = mode;
      this._reveal.update({ mode });
    }
  }
  componentWillUnmount() {
    if (this._reveal) this._reveal.destroy();
  }
  async mountReveal() {
    const { Reveal } = await import("./reveal.js");
    const root = document.getElementById("dc-root") || document.body;
    this._mode = this.props.reveal ?? "Fade up";
    this._reveal = new Reveal(root, { mode: this._mode });
  }
  __mob(v) {
    if (!this._rz && typeof window !== "undefined") { this._rz = () => this.forceUpdate(); window.addEventListener("resize", this._rz); }
    const w = typeof window !== "undefined" ? window.innerWidth : 1440;
    const mob = w <= 720, tab = !mob && w <= 1100;
    v.headerRowStyle = { display: "flex", flexDirection: mob ? "column" : "row", padding: mob ? "24px 20px 8px" : "40px 32px 40px 40px", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: mob ? 12 : 24 };
    v.navRowStyle = { display: "flex", flexDirection: "row", flexWrap: "wrap", gap: mob ? 20 : 40, alignItems: "flex-start" };
    const __open = mob && this._menuOpen;
    v.toggleMenu = () => { this._menuOpen = !this._menuOpen; this.forceUpdate(); };
    const __ln = { display: "block", width: 26, height: 2, background: "rgb(244,240,232)", transition: "transform .25s, opacity .2s" };
    v.burgerStyle = { display: mob ? "flex" : "none", flexDirection: "column", justifyContent: "center", alignItems: "center", gap: 6, width: 44, height: 44, padding: 0, border: 0, background: "transparent", cursor: "pointer", position: __open ? "fixed" : "relative", top: __open ? 20 : "auto", right: __open ? 16 : "auto", zIndex: 60 };
    v.burgerLine1 = Object.assign({}, __ln, __open ? { transform: "translateY(8px) rotate(45deg)" } : {});
    v.burgerLine2 = Object.assign({}, __ln, __open ? { opacity: 0 } : {});
    v.burgerLine3 = Object.assign({}, __ln, __open ? { transform: "translateY(-8px) rotate(-45deg)" } : {});
    if (mob) {
      v.headerRowStyle = { display: "flex", flexDirection: "row", padding: "20px 16px 8px 20px", justifyContent: "space-between", alignItems: "center", gap: 12 };
      v.navRowStyle = __open ? { position: "fixed", inset: 0, zIndex: 50, background: "rgb(11,11,10)", display: "flex", flexDirection: "column", justifyContent: "center", alignItems: "center", textAlign: "center", gap: 8, padding: "0 28px" } : { display: "none" };
    }
    if (!mob && !tab) return v;
    const P = mob ? {
      bandStyle: { boxShadow: "none" },
      bandCopyStyle: { padding: "16px 20px 48px", gap: 20 },
      logoStyle: { fontSize: 28 },
      navStyle: { fontSize: 34, lineHeight: "60px", color: "rgb(244,240,232)" }, navActiveStyle: { fontSize: 34, lineHeight: "60px", color: "rgb(244,240,232)" },
      titleStyle: { fontSize: 52 },
      leadStyle: { fontSize: 18 },
      factsStyle: { gap: "20px 40px" },
      factValueStyle: { fontSize: 22 },
      visitStyle: { padding: "14px 24px", fontSize: 14 },
      bodyStyle: { padding: "24px 20px 120px", gap: 24 },
      textBlockStyle: { padding: "40px 0 12px" },
      h2Style: { fontSize: 34 },
      bodyCopyStyle: { fontSize: 16 },
      featTitleStyle: { fontSize: 24 },
      rowStyle: { gap: 32, padding: "24px 0" },
      shotColStyle: { flex: "1 1 100%" }, copyColStyle: { flex: "1 1 100%" },
      pairStyle: { gap: 24 },
      nextStyle: { paddingTop: 48, gap: 28 },
      nextTitleStyle: { fontSize: 36 },
      nextCardStyle: { flex: "1 1 100%" },
      nextNameStyle: { fontSize: 26 },
      nextMetaStyle: { fontSize: 16 },
      heroWrapStyle: { padding: "40px 20px 24px" },
      heroWrapStyle2: { padding: "0 20px 72px" },
      heroMediaStyle: { aspectRatio: "16 / 10" },
      heroCopyStyle: { gap: 8, flexDirection: "column", alignItems: "flex-start" },
      heroNameStyle: { fontSize: 34 },
      heroMetaStyle: { fontSize: 16 },
      gridStyleTop: { padding: "32px 20px 72px", gridTemplateColumns: "minmax(0, 1fr)", rowGap: 48 },
      gridStyle: { padding: "24px 20px 120px", gridTemplateColumns: "minmax(0, 1fr)", rowGap: 48 },
      subheadStyle: { padding: "0 20px" },
      subheadTitleStyle: { fontSize: 36 },
    } : {
      bandCopyStyle: { padding: "32px 40px 56px" },
      titleStyle: { fontSize: 72 },
      leadStyle: { fontSize: 21 },
      bodyStyle: { padding: "48px 40px 160px" },
      h2Style: { fontSize: 40 },
      heroWrapStyle: { padding: "64px 40px 32px" },
      heroWrapStyle2: { padding: "0 40px 96px" },
      gridStyleTop: { padding: "48px 40px 96px", columnGap: 24, rowGap: 56 },
      gridStyle: { padding: "32px 40px 160px", gridTemplateColumns: "repeat(2, minmax(0, 1fr))", columnGap: 24, rowGap: 56 },
      subheadStyle: { padding: "0 40px" },
    };
    for (const k in P) if (v[k] && typeof v[k] === "object") v[k] = Object.assign({}, v[k], P[k]);
    if (mob) for (const key of ["items", "smallItems"]) v[key] = v[key].map(it => Object.assign({}, it, { wrapStyle: Object.assign({}, it.wrapStyle, { gap: 14 }), nameStyle: Object.assign({}, it.nameStyle, { fontSize: 26 }), metaStyle: Object.assign({}, it.metaStyle, { fontSize: 16 }) }));
    return v;
  }
  renderVals() { return this.__mob(this.__renderVals()); }
  __renderVals() {
    const m = MOODS[this.props.mood] || MOODS["Ink gallery"];
    const cols = this.props.columns ?? 3;
    const tall = (this.props.tileShape ?? "Landscape") === "Portrait";
    const nav = { fontFamily: "'Plus Jakarta Sans',sans-serif", fontWeight: 700, fontSize: 20, lineHeight: "44px", whiteSpace: "nowrap", color: m.bandInk };

    const tile = it => Object.assign({ href: "#" }, it, {
      wrapStyle: { display: "flex", flexDirection: "column", gap: 20, alignItems: "flex-start", minWidth: 0 },
      mediaStyle: { position: "relative", width: "100%", aspectRatio: tall ? "4 / 5" : "16 / 9", borderRadius: 12, overflow: "hidden", background: m.card, color: m.page },
      nameStyle: { fontFamily: "'Instrument Serif',serif", fontWeight: 400, fontSize: 32, lineHeight: "100%", color: m.ink },
      metaStyle: { fontFamily: "Inter,sans-serif", fontWeight: 400, fontSize: 18, lineHeight: "120%", letterSpacing: "0.02em", color: m.ink, opacity: 0.62 },
    });

    const active = this.state.filter;
    const tabBase = {
      appearance: "none", border: "1px solid " + m.ink, background: "transparent", color: m.ink,
      fontFamily: "Inter,sans-serif", fontWeight: 500, fontSize: 15, letterSpacing: "0.04em", textTransform: "uppercase",
      padding: "10px 20px", borderRadius: 999, cursor: "pointer", whiteSpace: "nowrap",
    };
    const visible = ITEMS.filter(it => active === "All" || CATS[it.slotId] === active);

    return {
      tabs: TABS.map(label => ({
        label,
        onClick: () => this.setState({ filter: label }),
        style: label === active
          ? Object.assign({}, tabBase, { background: m.ink, color: m.page })
          : Object.assign({}, tabBase, { borderColor: m.ink, opacity: 0.5 }),
      })),
      tabsStyle: { maxWidth: 1440, margin: "0 auto", boxSizing: "border-box", padding: "56px 80px 0", display: "flex", flexDirection: "row", gap: 12, flexWrap: "wrap" },
      items: visible.map(tile),
      smallItems: SMALL.map(tile),
      aiItems: AI.map(tile),
      uniItems: UNI.map(tile),
      subheadStyle: { maxWidth: 1440, margin: "0 auto", boxSizing: "border-box", padding: "0 80px" },
      subheadTitleStyle: { margin: 0, fontFamily: "'Instrument Serif',serif", fontWeight: 400, fontStyle: "italic", fontSize: 48, lineHeight: "100%", color: m.ink },
      pageStyle: { width: "100%", background: m.page, minHeight: "100vh" },
      bandStyle: { width: "100%", background: m.band, boxShadow: "inset 16px 0 0 0 " + m.page + ",inset -16px 0 0 0 " + m.page + ",inset 0 16px 0 0 " + m.page, boxSizing: "border-box" },
      bandCopyStyle: { maxWidth: 1440, margin: "0 auto", boxSizing: "border-box", padding: "80px 80px 96px", display: "flex", flexDirection: "column", gap: 24, alignItems: "flex-start" },
      logoStyle: { fontFamily: "'Instrument Serif',serif", fontWeight: 400, fontSize: 34, lineHeight: "100%", whiteSpace: "nowrap", color: m.bandInk },
      navStyle: nav,
      navActiveStyle: Object.assign({}, nav, { textDecoration: "underline", textUnderlineOffset: "6px" }),
      titleStyle: Object.assign({ margin: 0 }, { fontFamily: "'Instrument Serif',serif", fontWeight: 400, fontStyle: "italic", fontSize: 68, lineHeight: "100%", color: m.bandInk }),
      leadStyle: { margin: 0, maxWidth: 760, fontFamily: "Inter,sans-serif", fontWeight: 400, fontSize: 24, lineHeight: "150%", color: m.bandInk, opacity: 0.72 },
      gridStyleUni: {
        maxWidth: 1440, margin: "0 auto", boxSizing: "border-box", padding: "40px 80px 120px",
        display: "grid", gridTemplateColumns: "repeat(2, minmax(0, 1fr))", columnGap: 40, rowGap: 72,
      },
      gridStyleMid: {
        maxWidth: 1440, margin: "0 auto", boxSizing: "border-box", padding: "40px 80px 120px",
        display: "grid", gridTemplateColumns: "repeat(" + cols + ", minmax(0, 1fr))", columnGap: 40, rowGap: 72,
      },
      gridStyle: {
        maxWidth: 1440, margin: "0 auto", boxSizing: "border-box", padding: "40px 80px 200px",
        display: "grid", gridTemplateColumns: "repeat(" + cols + ", minmax(0, 1fr))", columnGap: 40, rowGap: 72,
      },
      heroWrapStyle: { maxWidth: 1440, margin: "0 auto", boxSizing: "border-box", padding: "96px 80px 40px" },
      heroWrapStyle2: { maxWidth: 1440, margin: "0 auto", boxSizing: "border-box", padding: "0 80px 120px" },
      heroCardStyle: { display: "flex", flexDirection: "column", gap: 24, alignItems: "flex-start", width: "100%" },
      heroMediaStyle: { position: "relative", width: "100%", aspectRatio: "21 / 9", borderRadius: 12, overflow: "hidden", background: m.card, color: m.page },
      heroCopyStyle: { display: "flex", flexDirection: "row", gap: 24, alignItems: "baseline", flexWrap: "wrap" },
      heroNameStyle: { fontFamily: "'Instrument Serif',serif", fontWeight: 400, fontSize: 52, lineHeight: "100%", color: m.ink },
      heroMetaStyle: { fontFamily: "Inter,sans-serif", fontWeight: 400, fontSize: 18, lineHeight: "120%", letterSpacing: "0.02em", color: m.ink, opacity: 0.62 },
      gridStyleTop: {
        maxWidth: 1440, margin: "0 auto", boxSizing: "border-box", padding: "72px 80px 148px",
        display: "grid", gridTemplateColumns: "repeat(2, minmax(0, 1fr))", columnGap: 40, rowGap: 72,
      },
    };
  }
}
</script>
</body>
</html>
