<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:rgb(11,11,10)}
a{color:inherit;text-decoration:none}
a:hover{opacity:.7}
</style>
</helmet>
<div style="{{ pageStyle }}">

  <div style="{{ bandStyle }}">
    <div style="{{ headerRowStyle }}">
      <a href="./Homepage.dc.html" style="{{ logoStyle }}">Lidziya Piatrova</a>
      <button type="button" aria-label="Menu" onClick="{{ toggleMenu }}" style="{{ burgerStyle }}"><span style="{{ burgerLine1 }}"></span><span style="{{ burgerLine2 }}"></span><span style="{{ burgerLine3 }}"></span></button>
      <div style="{{ navRowStyle }}">
        <a href="./Homepage.dc.html" style="{{ navStyle }}">HOME</a>
        <a href="./Projects.dc.html" style="{{ navStyle }}">PROJECTS</a>
        <!-- hidden: <a href="./AI discovery.dc.html" style="{{ navStyle }}">AI DISCOVERY</a> -->
        <a href="./CV.dc.html" style="{{ navStyle }}">CV</a>
        <a href="./Contact.dc.html" style="{{ navActiveStyle }}">CONTACT</a>
      </div>
    </div>
    <div style="{{ bandCopyStyle }}">
      <h1 style="{{ titleStyle }}">Let&rsquo;s work together</h1>
      <p style="{{ leadStyle }}">Open to product design work - full-time, contract or a single well-scoped project. Tallinn based, happy to work remotely.</p>
    </div>
  </div>

  <div style="{{ bodyStyle }}">
    <div data-reveal="sec" style="{{ sectionStyle }}">
      <h2 style="{{ secTitleStyle }}">Get in touch</h2>
      <div style="{{ colStyle }}">
        <sc-for list="{{ rows }}" as="row" hint-placeholder-count="4">
          <div style="{{ rowStyle }}">
            <span style="{{ labelStyle }}">{{ row.label }}</span>
            <sc-if value="{{ row.href }}" hint-placeholder-val="{{ true }}">
              <a href="{{ row.href }}" target="{{ row.target }}" rel="noopener" style="{{ linkStyle }}">{{ row.value }}</a>
            </sc-if>
            <sc-if value="{{ row.plain }}" hint-placeholder-val="{{ false }}">
              <span style="{{ plainStyle }}">{{ row.value }}</span>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;mood&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Cream editorial&quot;,&quot;Ink gallery&quot;,&quot;Acid studio&quot;],&quot;default&quot;:&quot;Ink gallery&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Feel&quot;},&quot;reveal&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Fade up&quot;,&quot;Scale in&quot;,&quot;Slide in&quot;,&quot;Off&quot;],&quot;default&quot;:&quot;Fade up&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Motion&quot;}}">
const MOODS = {
  "Cream editorial": { page: "rgb(254,249,241)", ink: "rgb(27,27,27)", band: "rgb(27,28,23)", bandInk: "rgb(254,249,241)", rule: "rgba(27,27,27,0.14)" },
  "Ink gallery": { page: "rgb(11,11,10)", ink: "rgb(244,240,232)", band: "rgb(11,11,10)", bandInk: "rgb(244,240,232)", rule: "rgba(244,240,232,0.16)" },
  "Acid studio": { page: "rgb(234,225,10)", ink: "rgb(20,20,18)", band: "rgb(20,20,18)", bandInk: "rgb(234,225,10)", rule: "rgba(20,20,18,0.2)" },
};

const ROWS = [
  { label: "Email", value: "4zangao@gmail.com", href: "mailto:4zangao@gmail.com" },
  { label: "Phone", value: "+372 5784 1386", href: "tel:+37257841386" },
  { label: "LinkedIn", value: "linkedin.com/in/lydia-petrova", href: "https://www.linkedin.com/in/lydia-petrova-b3161928a", target: "_blank" },
  { label: "Based in", value: "Tallinn, Estonia" },
];

class Component extends DCLogic {
  componentDidMount() { this.mountReveal(); }
  componentWillUnmount() { if (this._reveal) this._reveal.destroy(); }
  async mountReveal() {
    const { Reveal } = await import("./reveal.js");
    const root = document.getElementById("dc-root") || document.body;
    this._reveal = new Reveal(root, { mode: this.props.reveal ?? "Fade up" });
  }

  __mob(v) {
    if (!this._rz && typeof window !== "undefined") { this._rz = () => this.forceUpdate(); window.addEventListener("resize", this._rz); }
    const w = typeof window !== "undefined" ? window.innerWidth : 1440;
    const mob = w <= 720, tab = !mob && w <= 1100;
    v.headerRowStyle = { display: "flex", flexDirection: mob ? "column" : "row", padding: mob ? "24px 20px 8px" : "40px 32px 40px 40px", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: mob ? 12 : 24 };
    v.navRowStyle = { display: "flex", flexDirection: "row", flexWrap: "wrap", gap: mob ? 20 : 40, alignItems: "flex-start" };
    const __open = mob && this._menuOpen;
    v.toggleMenu = () => { this._menuOpen = !this._menuOpen; this.forceUpdate(); };
    const __ln = { display: "block", width: 26, height: 2, background: "rgb(244,240,232)", transition: "transform .25s, opacity .2s" };
    v.burgerStyle = { display: mob ? "flex" : "none", flexDirection: "column", justifyContent: "center", alignItems: "center", gap: 6, width: 44, height: 44, padding: 0, border: 0, background: "transparent", cursor: "pointer", position: __open ? "fixed" : "relative", top: __open ? 20 : "auto", right: __open ? 16 : "auto", zIndex: 60 };
    v.burgerLine1 = Object.assign({}, __ln, __open ? { transform: "translateY(8px) rotate(45deg)" } : {});
    v.burgerLine2 = Object.assign({}, __ln, __open ? { opacity: 0 } : {});
    v.burgerLine3 = Object.assign({}, __ln, __open ? { transform: "translateY(-8px) rotate(-45deg)" } : {});
    if (mob) {
      v.headerRowStyle = { display: "flex", flexDirection: "row", padding: "20px 16px 8px 20px", justifyContent: "space-between", alignItems: "center", gap: 12 };
      v.navRowStyle = __open ? { position: "fixed", inset: 0, zIndex: 50, background: "rgb(11,11,10)", display: "flex", flexDirection: "column", justifyContent: "center", alignItems: "center", textAlign: "center", gap: 8, padding: "0 28px" } : { display: "none" };
    }
    if (!mob && !tab) return v;
    const P = mob ? {
      bandStyle: { boxShadow: "none" },
      bandCopyStyle: { padding: "16px 20px 48px", gap: 20 },
      logoStyle: { fontSize: 28 },
      navStyle: { fontSize: 34, lineHeight: "60px", color: "rgb(244,240,232)" }, navActiveStyle: { fontSize: 34, lineHeight: "60px", color: "rgb(244,240,232)" },
      titleStyle: { fontSize: 52 },
      leadStyle: { fontSize: 18 },
      factsStyle: { gap: "20px 40px" },
      factValueStyle: { fontSize: 22 },
      visitStyle: { padding: "14px 24px", fontSize: 14 },
      bodyStyle: { padding: "24px 20px 120px", gap: 24 },
      textBlockStyle: { padding: "40px 0 12px" },
      h2Style: { fontSize: 34 },
      bodyCopyStyle: { fontSize: 16 },
      featTitleStyle: { fontSize: 24 },
      rowStyle: { gap: 32, padding: "24px 0" },
      shotColStyle: { flex: "1 1 100%" }, copyColStyle: { flex: "1 1 100%" },
      pairStyle: { gap: 24 },
      nextStyle: { paddingTop: 48, gap: 28 },
      nextTitleStyle: { fontSize: 36 },
      nextCardStyle: { flex: "1 1 100%" },
      nextNameStyle: { fontSize: 26 },
      nextMetaStyle: { fontSize: 16 },
    } : {
      bandCopyStyle: { padding: "32px 40px 56px" },
      titleStyle: { fontSize: 72 },
      leadStyle: { fontSize: 21 },
      bodyStyle: { padding: "48px 40px 160px" },
      h2Style: { fontSize: 40 },
    };
    for (const k in P) if (v[k] && typeof v[k] === "object") v[k] = Object.assign({}, v[k], P[k]);
    return v;
  }
  renderVals() { return this.__mob(this.__renderVals()); }
  __renderVals() {
    const m = MOODS[this.props.mood] || MOODS["Ink gallery"];
    const nav = { fontFamily: "'Plus Jakarta Sans',sans-serif", fontWeight: 700, fontSize: 20, lineHeight: "44px", whiteSpace: "nowrap", color: m.bandInk };
    const value = { fontFamily: "'Instrument Serif',serif", fontWeight: 400, fontSize: 34, lineHeight: "115%", color: m.ink };

    return {
      rows: ROWS.map(r => Object.assign({}, r, { target: r.target || "_self", plain: !r.href })),
      pageStyle: { width: "100%", background: m.page, minHeight: "100vh" },
      bandStyle: { width: "100%", background: m.band, boxSizing: "border-box", boxShadow: "inset 16px 0 0 0 " + m.page + ",inset -16px 0 0 0 " + m.page + ",inset 0 16px 0 0 " + m.page },
      bandCopyStyle: { maxWidth: 1440, margin: "0 auto", boxSizing: "border-box", padding: "72px 80px 96px", display: "flex", flexDirection: "column", gap: 24, alignItems: "flex-start" },
      logoStyle: { fontFamily: "'Instrument Serif',serif", fontWeight: 400, fontSize: 34, lineHeight: "100%", whiteSpace: "nowrap", color: m.bandInk },
      navStyle: nav,
      navActiveStyle: Object.assign({}, nav, { textDecoration: "underline", textUnderlineOffset: "6px" }),
      titleStyle: { margin: 0, fontFamily: "'Instrument Serif',serif", fontWeight: 400, fontStyle: "italic", fontSize: 68, lineHeight: "100%", color: m.bandInk },
      leadStyle: { margin: 0, maxWidth: 760, fontFamily: "Inter,sans-serif", fontWeight: 400, fontSize: 24, lineHeight: "150%", color: m.bandInk, opacity: 0.72 },
      bodyStyle: { maxWidth: 1440, margin: "0 auto", boxSizing: "border-box", padding: "120px 80px 200px", display: "flex", flexDirection: "column", gap: 120 },
      sectionStyle: { display: "grid", gridTemplateColumns: "minmax(0,240px) minmax(0,1fr)", columnGap: 64, rowGap: 32, alignItems: "start" },
      secTitleStyle: { margin: 0, paddingTop: 32, fontFamily: "'Instrument Serif',serif", fontWeight: 400, fontStyle: "italic", fontSize: 44, lineHeight: "100%", color: m.ink },
      colStyle: { display: "flex", flexDirection: "column", gap: 0 },
      rowStyle: { display: "flex", flexDirection: "column", gap: 10, alignItems: "flex-start", padding: "30px 0", borderTop: "1px solid " + m.rule },
      labelStyle: { fontFamily: "'Plus Jakarta Sans',sans-serif", fontWeight: 700, fontSize: 13, letterSpacing: "0.06em", textTransform: "uppercase", color: m.ink, opacity: 0.55 },
      linkStyle: Object.assign({}, value, { borderBottom: "1px solid " + m.rule }),
      plainStyle: value,
    };
  }
}
</script>
</body>
</html>
